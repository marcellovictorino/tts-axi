version: "2"

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
    - bodyclose
  settings:
    errcheck:
      # Writing to stdout/stderr or a buffer: a failed write has no useful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
