name: close outside PRs
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    if: github.event.pull_request.user.login != 'marcellovictorino'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: pr.number,
              body: "Thanks for the interest! This repo doesn't accept pull requests. Please open an issue describing the change instead.",
            });
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: "closed" });
